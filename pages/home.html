<div class="home-container">
  <section>
    <img src="./assets/img/" alt="Faixada da Instituição" />
    <h2>Ações que transformam</h2>
    <p>Transformar vidas com afeto, dignidade e esperança.</p>
  </section>

  <section class="news">
    <h2>Notícias</h2>

    <div class="news-container"></div>
  </section>

  <section>
    <h2>Como Contribuir</h2>
    <p>Envie-nos um email</p>
    <form id="userForm">
      <label for="nome">Nome Completo:</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
        pattern="[a-z]{16}"
        required
      />

      <label for="email">E-mail:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu email"
        required
      />

      <label for="telefone">Telefone:</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(00) 12345-6789"
        pattern="[0-9]{2}[0-9]{5}[0-9]{4}"
      />

      <button id="submit-user-contact" type="submit">Enviar</button>
    </form>
  </section>

  <section>
    <h2>Locais</h2>
    <p>Envie-nos um email</p>
  </section>
</div>
